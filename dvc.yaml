# ================================================
# DVC Pipeline — Bengaluru Traffic MLOps
# ================================================
# Reproducible ML pipeline stages
# Run with: dvc repro
# ================================================

stages:
  preprocess:
    cmd: python -m src.data_preprocessing
    deps:
      - dataset/Banglore_traffic_Dataset.csv
      - src/data_preprocessing.py
      - configs/config.yaml
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  featurize:
    cmd: python -m src.feature_engineering
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/feature_engineering.py
      - configs/config.yaml
    outs:
      - data/processed/encoders.joblib
      - data/processed/scaler.joblib

  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/encoders.joblib
      - data/processed/scaler.joblib
      - src/train.py
      - configs/config.yaml
    outs:
      - models/best_model.joblib
    metrics:
      - reports/best_model_metrics.csv:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - models/best_model.joblib
      - data/processed/test.csv
      - data/processed/feature_cols.joblib
      - src/evaluate.py
    plots:
      - reports/best_model_predictions.png:
          cache: false
      - reports/best_model_residuals.png:
          cache: false
      - reports/best_model_feature_importance.png:
          cache: false

  monitor:
    cmd: python -m src.monitor
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/monitor.py
      - configs/config.yaml
    outs:
      - reports/drift:
          cache: false
