name: Terraform Destroy Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "true" to confirm the destruction of the entire environment'
        required: true
        default: 'false'
        type: string

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: './Bengaluru Traffic Analysis/terraform'

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "true" ]; then
            echo "Destruction was not confirmed. Aborting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Bootstrap Terraform Backend
        run: |
          if ! aws s3api head-bucket --bucket mlops-cluster-tf-state 2>/dev/null; then
            aws s3api create-bucket --bucket mlops-cluster-tf-state --region ap-south-1 --create-bucket-configuration LocationConstraint=ap-south-1
            aws s3api put-bucket-versioning --bucket mlops-cluster-tf-state --versioning-configuration Status=Enabled
          fi
          if ! aws dynamodb describe-table --table-name mlops-cluster-tf-locks 2>/dev/null; then
            aws dynamodb create-table \
              --table-name mlops-cluster-tf-locks \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ap-south-1
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve
