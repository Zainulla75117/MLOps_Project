# ==================================================
# FastAPI Traffic Prediction — Kubernetes Deployment
# ==================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-api
  namespace: mlops
  labels:
    app: traffic-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: traffic-api
        version: v1
    spec:
      containers:
        - name: traffic-api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: traffic-api-config
                  key: MLFLOW_TRACKING_URI
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
